name: Trigger test suite

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the catalyst project
    runs-on: ubuntu-latest-m
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # Check https://github.com/livepeer/go-livepeer/pull/1891
          # for ref value discussion
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          go-version: "1.20.5"
          cache: true
          cache-dependency-path: go.sum

      - name: Install go modules
        if: steps.go.outputs.cache-hit != 'true'
        run: go mod download

      - name: go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run Revive Action by building from repository
        uses: docker://morphy/revive-action:v2
        with:
          config: config.toml

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Install misspell
        env:
          MISSPELL_VERSION: 0.8.0
          MISSPELL_SHA256: 0a889624797be3eed241eeef4dd2b982adadedd6556723fd00b9c3f721417b51
        run: |
          archive="${RUNNER_TEMP}/misspell.tar.gz"
          curl -fL --retry 3 \
            "https://github.com/golangci/misspell/releases/download/v${MISSPELL_VERSION}/misspell_${MISSPELL_VERSION}_linux_amd64.tar.gz" \
            -o "${archive}"
          echo "${MISSPELL_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}" \
            "misspell_${MISSPELL_VERSION}_linux_amd64/misspell"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: misspell
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find . -type f -print0 \
            | xargs -0 misspell \
            | reviewdog -efm="%f:%l:%c: %m" \
                -filter-mode=added \
                -name=misspell \
                -reporter=github-pr-check \
                -level=error \
                -fail-level=none

      - name: Install FFMPEG
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Run tests with coverage
        run:
          go test --covermode=atomic --coverprofile=coverage.out $(go list ./...
          | grep -v 'test/e2e')

      - name: Build Docker image
        run: make docker DOCKER_TAG=catalyst-e2e-test

      - name: Build Docker Box image
        run: make box

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.7.3
          CLOUDFLARED_SHA256: 9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17
        run: |
          curl -fL --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o "${RUNNER_TEMP}/cloudflared"
          echo "${CLOUDFLARED_SHA256}  ${RUNNER_TEMP}/cloudflared" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/cloudflared"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run E2E tests
        run:
          go test $(go list ./... | grep 'test/e2e') --timeout 30m -v --image
          catalyst-e2e-test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          name: ${{ github.event.repository.name }}
          token: ${{ secrets.CI_CODECOV_TOKEN }}

  codeql:
    name: Perform CodeQL analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
